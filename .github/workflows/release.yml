name: Release executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: macos-arm64
          - os: macos-26-intel
            target: macos-x64
          - os: windows-2025
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:executable
      - run: npm run test:executable

      - name: Locate or install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Find-InnoCompiler {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if ($base) {
                $candidate = Join-Path $base 'Inno Setup 6\ISCC.exe'
                if (Test-Path -LiteralPath $candidate) { return $candidate }
              }
            }
            return $null
          }
          $compiler = Find-InnoCompiler
          if (-not $compiler) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $compiler = Find-InnoCompiler
          }
          if (-not $compiler) { throw 'Inno Setup 6 compiler not found.' }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV

      - name: Package native installers and portable archives
        run: npm run package:release -- --target ${{ matrix.target }}

      - name: Smoke test the app from its disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image="$PWD/dist/release/tournament-overlay-${{ matrix.target }}.dmg"
          mount="$PWD/dist/packaging/mounted-app"
          mkdir -p "$mount"
          hdiutil verify "$image"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          PUBLIC_DIRECTORY="$mount/Tournament Overlay.app/Contents/Resources/public" \
            EXECUTABLE_PATH="$mount/Tournament Overlay.app/Contents/MacOS/TournamentOverlay" npm run test:executable
          MACOS_APP_PATH="$mount/Tournament Overlay.app" node --import tsx scripts/smoke-macos-app.ts

      - name: Smoke test the extracted Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/packaging/extracted
          tar -xzf dist/release/tournament-overlay-${{ matrix.target }}.tar.gz -C dist/packaging/extracted
          EXECUTABLE_PATH="$PWD/dist/packaging/extracted/TournamentOverlay" npm run test:executable

      - name: Test Windows installation and safe replacement
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/packaging/test-windows-install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tournament-overlay-${{ matrix.target }}
          path: dist/release/tournament-overlay-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum tournament-overlay-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Tournament Overlay ${GITHUB_REF_NAME}"
