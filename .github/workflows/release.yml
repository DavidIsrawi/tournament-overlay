name: Release executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: macos-arm64
          - os: macos-26-intel
            target: macos-x64
          - os: windows-2025
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:executable
      - run: npm run test:executable

      - name: Package executable
        if: runner.os != 'Windows'
        run: >-
          tar -C dist/executable -czf
          tournament-overlay-${{ matrix.target }}.tar.gz .

      - name: Package executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path dist/executable/*
          -DestinationPath tournament-overlay-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tournament-overlay-${{ matrix.target }}
          path: tournament-overlay-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum tournament-overlay-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "Tournament Overlay ${GITHUB_REF_NAME}"
